# Test config: fake_pi.py (tcp) -> Fluent Bit -> backend + Elasticsearch
# Run:  docker run --rm --network host -v $PWD/tools/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf fluent/fluent-bit

[SERVICE]
    Flush         1
    Log_Level     info
    storage.path  /tmp/fluent-bit-buffer

[INPUT]
    Name          tcp
    Listen        0.0.0.0
    Port          5170
    Format        json
    Tag           ws
    storage.type  filesystem

[OUTPUT]
    Name          http
    Match         ws
    Host          127.0.0.1
    Port          8000
    URI           /ingest
    Format        json_lines
    json_date_key false
    workers       1

[OUTPUT]
    Name          es
    Match         ws
    Host          <ES_IP>
    Port          9200
    Index         wiresploit-event
    Suppress_Type_Name On
    HTTP_User     <user>
    HTTP_Passwd   <pass>
